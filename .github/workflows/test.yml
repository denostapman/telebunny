name: Test

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: cachix/install-nix-action@v31
            - run: nix develop --command npm ci
            - run: nix develop --command npm run build
            - run: nix develop --command npm test
