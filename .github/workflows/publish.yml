name: Publish

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: cachix/install-nix-action@v31
            - run: nix develop --command npm ci
            - run: nix develop --command npm test
            - run: nix develop --command npm stage publish
